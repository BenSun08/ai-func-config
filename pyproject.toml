[project]
name = "ai-func-config"
version = "0.1.0"
description = "Evidence-backed bus function configuration using synthetic data"
readme = "README.md"
authors = [
    { name = "SanWang", email = "bensun08@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
busconfig = "busconfig.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "busconfig"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
